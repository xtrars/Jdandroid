name: Release

# Baut bei einem Tag der Form v<versionName> (z. B. v0.0.4) die signierte
# Release-APK und legt sie als Asset eines GitHub-Releases ab.
#
# Signierung, zwei Wege (app/build.gradle.kts, signingConfigs.release):
#   a) Repository-Secrets KEYSTORE_BASE64 (Keystore als Base64), KEYSTORE_PASSWORD,
#      KEY_ALIAS und KEY_PASSWORD gesetzt: der Keystore wird in eine temporaere
#      Datei dekodiert und ueber Umgebungsvariablen (KEYSTORE_FILE, ...) an den
#      Build gegeben. So fuer eine Veroeffentlichung, siehe docs/RELEASE.md.
#   b) Keine Secrets: Keystore app/keystore/release.jks aus dem Repo mit den
#      Passwoertern aus app/build.gradle.kts (bisheriges Verhalten, Eigenbedarf).
#
# Ablauf fuer ein Release:
#   1. versionName/versionCode in app/build.gradle.kts erhoehen, committen.
#   2. git tag v<versionName> && git push origin v<versionName>
# Der Tag muss zum versionName passen, sonst bricht der Lauf ab.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Bestehender Tag (z. B. v0.0.4), fuer den das Release erneut gebaut wird"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Leer, wenn die Secrets nicht angelegt sind -> Keystore aus dem Repo.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Tag gegen versionName pruefen
        run: |
          set -eu
          version="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          code="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9]*\).*/\1/p' app/build.gradle.kts)"
          echo "versionName=$version versionCode=$code Tag=$TAG"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag '$TAG' passt nicht zu versionName '$version' in app/build.gradle.kts (erwartet 'v$version')."
            exit 1
          fi
          {
            echo "VERSION=$version"
            echo "VERSION_CODE=$code"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6

      - name: Keystore aus Secrets bereitstellen
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -eu
          for v in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            eval "wert=\${$v:-}"
            if [ -z "$wert" ]; then
              echo "::error::Secret $v fehlt, obwohl KEYSTORE_BASE64 gesetzt ist."
              exit 1
            fi
          done
          datei="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$datei"
          echo "KEYSTORE_FILE=$datei" >> "$GITHUB_ENV"
          echo "Signierung: Keystore aus Secrets (Alias $KEY_ALIAS)."
      - name: Signierung ohne Secrets
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "Signierung: Keystore aus dem Repository (app/keystore/release.jks)."

      # Beide Tasks getrennt, wie in CLAUDE.md beschrieben: parallele
      # KSP-Laeufe koennen sonst ein leeres Room-Schema anlegen.
      - name: Unit-Tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Release-APK bauen
        run: ./gradlew --no-daemon assembleRelease

      - name: APK pruefen und Pruefsumme erzeugen
        run: |
          set -eu
          apk="app/build/outputs/apk/release/JDAndroid-${VERSION}.apk"
          test -f "$apk" || { echo "::error::$apk wurde nicht gebaut."; ls -l app/build/outputs/apk/release/; exit 1; }
          mkdir -p dist
          cp "$apk" dist/
          (cd dist && sha256sum "JDAndroid-${VERSION}.apk" > "JDAndroid-${VERSION}.apk.sha256")
          # Signatur pruefen (apksigner aus den Build-Tools des Runners)
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -n "$apksigner" ]; then
            "$apksigner" verify --print-certs "dist/JDAndroid-${VERSION}.apk"
          else
            echo "::warning::apksigner nicht gefunden, Signatur nicht geprueft."
          fi
          # Hinweis: liegt fuer diese Version schon eine APK in release/, muss sie
          # nicht bytegleich sein (Build-Zeitstempel); die Signatur ist dieselbe,
          # solange kein anderer Keystore aus den Secrets benutzt wird.
          if [ -f "release/JDAndroid-${VERSION}.apk" ]; then
            echo "release/JDAndroid-${VERSION}.apk ist im Repo vorhanden."
          fi

      - name: GitHub-Release anlegen oder aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          notes="$(printf '%s\n' \
            "Signierte Release-APK von JDAndroid ${VERSION} (versionCode ${VERSION_CODE})." \
            "" \
            "Installation: APK auf das Geraet kopieren, Installation aus unbekannten Quellen erlauben, oeffnen." \
            "Updates ueber diese APK funktionieren nur, wenn bereits eine mit derselben Signatur installiert ist" \
            "(alle Releases dieses Repos sind mit demselben Keystore signiert)." \
            "Pruefsumme: siehe JDAndroid-${VERSION}.apk.sha256.")"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "JDAndroid ${VERSION}" \
              --notes "$notes" \
              --generate-notes
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: JDAndroid-${{ env.VERSION }}
          path: dist/*

      - name: Temporaeren Keystore entfernen
        if: always() && env.KEYSTORE_FILE != ''
        run: rm -f "$KEYSTORE_FILE"
