name: Release

# Baut bei einem Tag der Form v<versionName> (z. B. v0.0.4) die signierte
# Release-APK und legt sie als Asset eines GitHub-Releases ab.
#
# Signierung, zwei Wege (app/build.gradle.kts, signingConfigs.release):
#   a) Repository-Secrets KEYSTORE_BASE64 (Keystore als Base64), KEYSTORE_PASSWORD,
#      KEY_ALIAS und KEY_PASSWORD gesetzt: der Keystore wird in eine temporaere
#      Datei dekodiert und ueber Umgebungsvariablen (KEYSTORE_FILE, ...) an den
#      Build gegeben. So fuer eine Veroeffentlichung, siehe docs/RELEASE.md.
#   b) Keine Secrets: der Keystore liegt nicht im Repository, die CI kann dann
#      nicht signieren. Stattdessen wird die lokal signierte, eingecheckte
#      Datei release/JDAndroid-<version>.apk als Release-Asset verwendet.
#
# Ablauf fuer ein Release:
#   1. versionName/versionCode in app/build.gradle.kts erhoehen, committen.
#   2. git tag v<versionName> && git push origin v<versionName>
#      oder: diesen Workflow manuell mit tag=v<versionName> auf dem Branch
#      starten; ein fehlender Tag wird dabei angelegt.
# Der Tag muss zum versionName passen, sonst bricht der Lauf ab.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag (z. B. v0.1.0): bestehender Tag wird neu gebaut, fehlender auf dem gewaehlten Branch angelegt"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Leer, wenn die Secrets nicht angelegt sind -> APK aus release/.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Manueller Start: existiert der Tag, wird er ausgecheckt; sonst wird er
      # auf dem gewaehlten Branch angelegt und gepusht (Tag-Pushes mit
      # GITHUB_TOKEN loesen keinen weiteren Lauf aus).
      - name: Tag auschecken oder anlegen
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            git checkout -q "refs/tags/$TAG"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "JDAndroid ${TAG#v}"
            git push origin "refs/tags/$TAG"
          fi

      - name: Tag gegen versionName pruefen
        run: |
          set -eu
          version="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          code="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9]*\).*/\1/p' app/build.gradle.kts)"
          echo "versionName=$version versionCode=$code Tag=$TAG"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag '$TAG' passt nicht zu versionName '$version' in app/build.gradle.kts (erwartet 'v$version')."
            exit 1
          fi
          {
            echo "VERSION=$version"
            echo "VERSION_CODE=$code"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6

      - name: Keystore aus Secrets bereitstellen
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -eu
          for v in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            eval "wert=\${$v:-}"
            if [ -z "$wert" ]; then
              echo "::error::Secret $v fehlt, obwohl KEYSTORE_BASE64 gesetzt ist."
              exit 1
            fi
          done
          datei="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$datei"
          # Secrets ohne Zeilenumbrueche und Randleerzeichen weitergeben (ein
          # per Zwischenablage eingefuegtes Passwort endet oft auf "\n").
          {
            echo "KEYSTORE_FILE=$datei"
            echo "KEYSTORE_PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            echo "KEY_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            echo "KEY_PASSWORD=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          } >> "$GITHUB_ENV"
          echo "Signierung: Keystore aus Secrets (Alias $KEY_ALIAS)."
      # Beide Gradle-Tasks getrennt, wie in CLAUDE.md beschrieben: parallele
      # KSP-Laeufe koennen sonst ein leeres Room-Schema anlegen.
      - name: Unit-Tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Release-APK bauen und signieren
        if: env.KEYSTORE_BASE64 != ''
        run: ./gradlew --no-daemon assembleRelease
      - name: Signierte APK aus dem Repository verwenden
        if: env.KEYSTORE_BASE64 == ''
        run: |
          set -eu
          apk="release/JDAndroid-${VERSION}.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::Keine Signatur-Secrets (KEYSTORE_BASE64 ...) und keine Datei $apk im Repository."
            exit 1
          fi
          echo "::notice::Signatur-Secrets fehlen; die lokal signierte Datei $apk wird als Release-Asset verwendet."
          mkdir -p app/build/outputs/apk/release
          cp "$apk" app/build/outputs/apk/release/

      - name: APK pruefen und Pruefsumme erzeugen
        run: |
          set -eu
          apk="app/build/outputs/apk/release/JDAndroid-${VERSION}.apk"
          test -f "$apk" || { echo "::error::$apk wurde nicht gebaut."; ls -l app/build/outputs/apk/release/; exit 1; }
          mkdir -p dist
          cp "$apk" dist/
          (cd dist && sha256sum "JDAndroid-${VERSION}.apk" > "JDAndroid-${VERSION}.apk.sha256")
          # Signatur pruefen (apksigner aus den Build-Tools des Runners)
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -n "$apksigner" ]; then
            "$apksigner" verify --print-certs "dist/JDAndroid-${VERSION}.apk"
          else
            echo "::warning::apksigner nicht gefunden, Signatur nicht geprueft."
          fi

      - name: GitHub-Release anlegen oder aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          notes="$(printf '%s\n' \
            "Signierte Release-APK von JDAndroid ${VERSION} (versionCode ${VERSION_CODE})." \
            "" \
            "Installation: APK auf das Geraet kopieren, Installation aus unbekannten Quellen erlauben, oeffnen." \
            "Updates ueber diese APK funktionieren nur, wenn bereits eine mit derselben Signatur installiert ist" \
            "(alle Releases dieses Repos sind mit demselben Keystore signiert)." \
            "Pruefsumme: siehe JDAndroid-${VERSION}.apk.sha256.")"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "JDAndroid ${VERSION}" \
              --notes "$notes" \
              --generate-notes
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: JDAndroid-${{ env.VERSION }}
          path: dist/*

      - name: Temporaeren Keystore entfernen
        if: always() && env.KEYSTORE_FILE != ''
        run: rm -f "$KEYSTORE_FILE"
