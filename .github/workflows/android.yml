name: Android CI

on:
  push:
    branches:
      - main
      - master
      - "claude/**"
    # Release-Commits bringen nur die APK aus der CI, Doku braucht keinen Build.
    paths-ignore:
      - "release/**"
      - "docs/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit-Tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon lintDebug
      - name: Lint-Report hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Instrumentierte Tests kompilieren
        run: ./gradlew --no-daemon compileDebugAndroidTestKotlin
      - name: Release-APK bauen
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: JDAndroid-release
          path: app/build/outputs/apk/release/*.apk

  # Instrumentierte Tests (MigrationTest unter app/src/androidTest) auf einem
  # Android-Emulator. Laeuft unabhaengig vom Build-Job, nur bei Push, Pull
  # Request und manuellem Start (dieselben Ausloeser wie oben).
  instrumented:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # KVM fuer den Emulator freigeben (siehe Doku von android-emulator-runner)
      - name: KVM freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Instrumentierte Tests im Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Gegen den mit R8 geschrumpften Build: prueft die JNI-Rueckrufe des RAR-Entpackers.
          # Ein abgestuerzter Testprozess laesst Gradle trotzdem "erfolgreich" melden, daher
          # werden die Ergebnisse selbst geprueft. Danach einmal normal starten (Absturz der
          # App selbst?); logcat zeigt den Grund.
          script: |
            adb logcat -c
            ./gradlew --no-daemon -Pjd.testMinified connectedMinifiedAndroidTest || touch instrumentierung-fehlgeschlagen
            adb install -r app/build/outputs/apk/minified/app-minified.apk
            adb shell am start -W -n com.jdandroid/.ui.MainActivity
            sleep 8
            adb logcat -d > logcat.txt
            test ! -f instrumentierung-fehlgeschlagen
            ! grep -rqs "<failure" app/build/outputs/androidTest-results/connected
            ! grep -q "FATAL EXCEPTION" logcat.txt
      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: androidTest-report
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            logcat.txt
          if-no-files-found: ignore
