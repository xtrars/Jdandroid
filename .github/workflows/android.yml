name: Android CI

on:
  push:
    branches:
      - main
      - master
      - "claude/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit-Tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon lintDebug
      - name: Lint-Report hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Instrumentierte Tests kompilieren
        run: ./gradlew --no-daemon compileDebugAndroidTestKotlin
      - name: Release-APK bauen
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: JDAndroid-release
          path: app/build/outputs/apk/release/*.apk

  # Instrumentierte Tests (MigrationTest unter app/src/androidTest) auf einem
  # Android-Emulator. Laeuft unabhaengig vom Build-Job, nur bei Push, Pull
  # Request und manuellem Start (dieselben Ausloeser wie oben).
  instrumented:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # KVM fuer den Emulator freigeben (siehe Doku von android-emulator-runner)
      - name: KVM freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Instrumentierte Tests im Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: androidTest-report
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
